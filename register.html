<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Register | BloodBank System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <a class="brand" href="index.html">&#129656; BloodBank System</a>
    <div class="nav-links">
        <a href="index.html">Home</a><a href="register.html" class="active">Donor Register</a><a href="search.html">Search Blood</a><a href="admin_login.html">Admin Login</a><a href="request.html">Request Blood</a><a href="view_requests.html">View Requests</a><a href="blood_info.html">Blood Info</a>    </div>
</nav>
<main>
<div class="form-box">
    <h2>Donor Registration</h2>

        
    <form method="post" action="register.html">
        <input type="text" name="name" placeholder="Enter Name" value="" required>
        <input type="number" name="age" placeholder="Enter Age" min="18" max="65" value="" required>
        <select name="gender" required>
            <option value="">Select Gender</option>
                            <option value="Male" >Male</option>
                            <option value="Female" >Female</option>
                            <option value="Other" >Other</option>
                    </select>
        <select name="blood_group" required>
            <option value="">Select Blood Group</option>
                            <option value="A+" >A+</option>
                            <option value="A-" >A-</option>
                            <option value="B+" >B+</option>
                            <option value="B-" >B-</option>
                            <option value="O+" >O+</option>
                            <option value="O-" >O-</option>
                            <option value="AB+" >AB+</option>
                            <option value="AB-" >AB-</option>
                    </select>
        <input type="text" name="city" placeholder="Enter City" value="" required>
        <input type="text" name="mobile" placeholder="Enter Mobile" maxlength="10" pattern="[0-9]{10}" title="Enter exactly 10 digits" value="" required>
        <button type="submit">Register</button>
    </form>
</div>
</main>
<footer class="footer">
    &copy; 2026 Online Blood Bank Management System
</footer>
<script src="app.js"></script>
</body>
</html>
